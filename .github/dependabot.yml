version: 2

updates:
  # Weekly dependency updates for the toolchain (there are no runtime dependencies).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    ignore:
      # typescript-eslint 8.x declares peerDependencies.typescript ">=4.8.4 <6.1.0".
      # TypeScript 7 would break `npm ci` and type-aware linting, so it cannot be
      # adopted until typescript-eslint supports it. Remove this rule at that point.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
