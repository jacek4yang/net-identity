name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast check job. It stays sequential on purpose: the checks are quick and
  # parallel jobs would only duplicate setup. `quality` is a required status check
  # on main.
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # format check, ESLint, TypeScript, unit tests, build and web-ext lint.
      - name: Run checks
        run: npm run check

      - name: Verify packaging
        run: npm run package

      - name: Upload the packaged extension
        uses: actions/upload-artifact@v7
        with:
          name: net-identity-package
          path: artifacts/*.zip
          if-no-files-found: error

  # A separate real-Firefox job. The reusable workflow is deterministic and only
  # talks to loopback servers; `npm run e2e` stays out because it needs the public
  # GeoIP provider. Add `firefox` to main's required status checks (see
  # docs/CI.md) so this gate, not just the fast job, protects merges.
  firefox:
    name: firefox
    uses: ./.github/workflows/firefox-invariants.yml
