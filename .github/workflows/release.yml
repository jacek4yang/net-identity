name: Release

# A tag push runs the release gates and submits the version to AMO as a listed
# add-on. Approval is finalized separately. A manual run repeats checks only.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amo-distribution
  cancel-in-progress: false

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run check` includes `check:version`, which validates the tag against
      # package.json and public/manifest.json when the ref is a `vX.Y.Z` tag.
      - name: Run checks
        run: npm run check

      - name: Build the production package
        run: npm run package

  # The same reusable definition the pull-request CI calls, so a tag cannot be
  # submitted from a commit that has not passed the real-Firefox invariants.
  firefox:
    name: firefox
    uses: ./.github/workflows/firefox-invariants.yml

  submit:
    needs: [quality, firefox]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Record draft provenance and submit exact listed version
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node --experimental-strip-types scripts/release-control.mjs submit
