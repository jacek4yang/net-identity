name: Capture real OpenFreeMap listing images

# Optional, manually requested, provider-dependent artwork capture. This does not
# replace any deterministic PR/release gate, sign a build, or publish to AMO.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      capture_public_map:
        description: Load real OpenFreeMap data for the synthetic Tokyo listing fixture
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capture:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.capture_public_map) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'preview-real-map' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install official Firefox and software WebGL display
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          wget --timeout=30 --tries=3 -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- \
            | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" \
            | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' \
            | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y firefox openssl xvfb libgl1-mesa-dri fontconfig fonts-noto-cjk fonts-noto-core
          test -n "$(fc-list :lang=zh family)"
          mkdir -p artifacts/capture-fonts
          fc-list :lang=si family | sort -u | tee artifacts/capture-fonts/sinhala.txt
          test -s artifacts/capture-fonts/sinhala.txt
      - run: npm ci
      - run: npm run build:prod
      - name: Verify narrow live-capture proxy
        run: node --test scripts/live-map-proxy.test.mjs
      - name: Require deterministic real-render gate first
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "2"
        run: xvfb-run -a node scripts/e2e-map.mjs --firefox /usr/bin/firefox --screenshots artifacts/map-gate
      - name: Capture actual provider geography using the production UI
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          xvfb-run -a node scripts/e2e-ui.mjs --firefox /usr/bin/firefox \
            --live-map --screenshots artifacts/listing-map --timeout 180
          git rev-parse HEAD > artifacts/listing-map/source-commit.txt
      - name: Capture bilingual light and dark review surfaces
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          for theme in dark light; do
            args=()
            if [ "$theme" = "light" ]; then args+=(--light); fi
            xvfb-run -a node scripts/e2e-ui.mjs --firefox /usr/bin/firefox \
              --live-map --review --screenshots "artifacts/review-$theme" --timeout 180 "${args[@]}"
            xvfb-run -a node scripts/e2e-ui.mjs --firefox /usr/bin/firefox \
              --draft-check --draft-evidence artifacts/draft-review --timeout 180 "${args[@]}"
          done
      - name: Upload bilingual acceptance images
        uses: actions/upload-artifact@v7
        with:
          name: candidate-bilingual-review
          path: |
            artifacts/review-dark/*
            artifacts/review-light/*
            artifacts/draft-review/*
            artifacts/capture-fonts/*
          if-no-files-found: error
      - name: Upload candidate images for visual review, not publication
        uses: actions/upload-artifact@v7
        with:
          name: candidate-real-map-listing
          path: artifacts/listing-map/*
          if-no-files-found: error
      - name: Upload deterministic rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-map-render-gate
          path: artifacts/map-gate/*
          if-no-files-found: ignore
